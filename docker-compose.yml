version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: projectforge_db
    environment:
      POSTGRES_USER: projectforge_user
      POSTGRES_PASSWORD: projectforge_password
      POSTGRES_DB: projectforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectforge_backend
    environment:
      DATABASE_URL: postgresql://projectforge_user:projectforge_password@db:5432/projectforge_db
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projectforge_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
